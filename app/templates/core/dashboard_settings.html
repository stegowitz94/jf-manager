{% extends "base.html" %}{% block title %}Dashboard anpassen{% endblock %}{% block content %}<a class="back-link" href="{% url 'core:dashboard' %}">← Zurück</a><div class="page-header"><div><p class="eyebrow">Persönlich</p><h1>Dashboard anpassen</h1><p class="muted">Widgets einblenden und mit den Pfeilen sortieren.</p></div></div><form method="post" class="card settings-list" data-widget-settings>{% csrf_token %}<div class="widget-settings-list">{% for widget in widgets %}<div class="widget-setting" data-widget-row><input type="hidden" name="order_{{ forloop.counter0 }}" value="{{ widget.key }}" data-order-input><label><input type="checkbox" name="{{ widget.field }}" {% if widget.enabled %}checked{% endif %}> <span>{{ widget.label }}</span></label><div class="order-buttons"><button type="button" class="icon-button" data-move="up" aria-label="Nach oben">↑</button><button type="button" class="icon-button" data-move="down" aria-label="Nach unten">↓</button></div></div>{% endfor %}</div><button class="button">Speichern</button></form><script>document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{const row=b.closest('[data-widget-row]');const list=row.parentElement;if(b.dataset.move==='up'&&row.previousElementSibling)list.insertBefore(row,row.previousElementSibling);if(b.dataset.move==='down'&&row.nextElementSibling)list.insertBefore(row.nextElementSibling,row);[...list.children].forEach((r,i)=>{r.querySelector('[data-order-input]').name='order_'+i})}));</script>{% endblock %}
