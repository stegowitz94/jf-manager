{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}{% block content %}<a class="back-link" href="{% if entry %}{{ entry.get_absolute_url }}{% else %}{% url 'waitinglist:list' %}{% endif %}">← Zurück</a><div class="page-header"><h1>{{ title }}</h1></div><form method="post" class="card form-grid">{% csrf_token %}{% for field in form %}<div class="field {% if field.name == 'note' %}span-full{% endif %}"><label>{{ field.label }}</label>{{ field }}{% for e in field.errors %}<div class="error">{{ e }}</div>{% endfor %}</div>{% endfor %}<div class="span-full"><button class="button">Speichern</button></div></form>{% endblock %}
