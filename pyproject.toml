[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["app"]

[project]
name = "jf-manager"
version = "1.0.0"
description = "Self-hosted management application for youth fire brigades"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
